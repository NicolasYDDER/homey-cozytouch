<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Shogun Zone Control: répartiteur (3 duct collars) + tall controller -->
  <!-- Répartiteur body -->
  <rect fill="none" x="4" y="22" width="48" height="40" rx="4" stroke="currentColor" stroke-width="2.6"/>
  <!-- Silver lid band -->
  <line fill="none" x1="8" y1="32" x2="48" y2="32" stroke="currentColor" stroke-width="2"/>
  <!-- Three circular duct collars with damper -->
  <circle fill="none" cx="14" cy="46" r="5.5" stroke="currentColor" stroke-width="2.2"/>
  <line fill="none" x1="9.5" y1="46" x2="18.5" y2="46" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle fill="none" cx="28" cy="46" r="5.5" stroke="currentColor" stroke-width="2.2"/>
  <line fill="none" x1="23.5" y1="46" x2="32.5" y2="46" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle fill="none" cx="42" cy="46" r="5.5" stroke="currentColor" stroke-width="2.2"/>
  <line fill="none" x1="37.5" y1="46" x2="46.5" y2="46" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Feet -->
  <path fill="none" d="M10 62 V68 H16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path fill="none" d="M42 62 V68 H36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tall controller -->
  <rect fill="none" x="58" y="10" width="18" height="52" rx="3.5" stroke="currentColor" stroke-width="2.4"/>
  <rect fill="none" x="61" y="14" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
  <circle fill="none" cx="67" cy="36" r="5" stroke="currentColor" stroke-width="2"/>
  <circle fill="none" cx="67" cy="36" r="2" stroke="currentColor" stroke-width="1.5"/>
</svg>
