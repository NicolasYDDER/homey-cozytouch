<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Atlantic Shogun Compact Zone Control (photo-based) -->

  <!-- Body -->
  <path d="M5 40 L53 40 L53 60 L5 60 Z"
        stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M53 40 L69 30 L69 50 L53 60 Z"
        stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Lid (top + scalloped front lip over piquages) -->
  <path d="M5 40 L21 30 L69 30 L53 40 Z"
        stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M7 40
           A7 7 0 0 0 21 40
           A7 7 0 0 0 35 40
           A7 7 0 0 0 49 40"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

  <!-- Front piquages + dampers -->
  <circle cx="14" cy="50" r="6" stroke="currentColor" stroke-width="2"/>
  <path d="M8.5 50 H19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <circle cx="28" cy="50" r="6" stroke="currentColor" stroke-width="2"/>
  <path d="M22.5 50 H33.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <circle cx="42" cy="50" r="6" stroke="currentColor" stroke-width="2"/>
  <path d="M36.5 50 H47.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Side piquage -->
  <ellipse cx="69" cy="40" rx="3.2" ry="6" stroke="currentColor" stroke-width="2"/>
  <path d="M69 34.2 V45.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Feet -->
  <path d="M9 60 V65 H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M49 60 V65 H45" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
