<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Floor-standing cylindrical water heater with control panel -->
  <rect x="24" y="12" width="32" height="58" rx="16" stroke="currentColor" stroke-width="2.6"/>
  <!-- Pipe stub on top -->
  <rect x="36" y="4" width="8" height="10" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <!-- Seams -->
  <line x1="28" y1="26" x2="52" y2="26" stroke="currentColor" stroke-width="1.8"/>
  <line x1="28" y1="56" x2="52" y2="56" stroke="currentColor" stroke-width="1.8"/>
  <!-- Control panel -->
  <rect x="30" y="32" width="20" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
  <rect x="33" y="35" width="14" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="36" cy="46" r="2.2" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="44" cy="46" r="1.6" fill="currentColor"/>
  <!-- Feet -->
  <rect x="30" y="68" width="8" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
  <rect x="42" y="68" width="8" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
</svg>
