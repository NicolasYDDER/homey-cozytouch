<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Air/water heat pump (Alféa) - outdoor unit on the left, indoor tank module on the right -->
  <!-- Outdoor unit -->
  <rect x="3" y="26" width="36" height="30" rx="3" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Fan -->
  <circle cx="17" cy="41" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M17 41 L11 37" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M17 41 L21 34.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M17 41 L21 47.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Exchanger fins -->
  <line x1="30" y1="30" x2="30" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="34" y1="30" x2="34" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <!-- Feet -->
  <path d="M9 56 V60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M33 56 V60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Water pipes to the indoor module -->
  <line x1="39" y1="34" x2="49" y2="34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="46" x2="49" y2="46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Indoor hydraulic module with hot water tank -->
  <rect x="49" y="10" width="28" height="60" rx="6" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Control panel -->
  <rect x="54" y="16" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <line x1="57" y1="21" x2="66" y2="21" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="70" cy="30" r="1.8" fill="currentColor"/>
  <!-- Tank seams -->
  <line x1="49" y1="36" x2="77" y2="36" stroke="currentColor" stroke-width="1.5"/>
  <line x1="49" y1="62" x2="77" y2="62" stroke="currentColor" stroke-width="1.5"/>
  <!-- Feet -->
  <path d="M55 70 V74" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M71 70 V74" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
