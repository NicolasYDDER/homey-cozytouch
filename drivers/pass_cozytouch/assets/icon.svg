<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Pass Cozytouch wall module (io-homecontrol) -->
  <rect x="22" y="8" width="36" height="64" rx="5" ry="5"
        stroke="currentColor" stroke-width="2.5"/>
  <!-- Mounting slots -->
  <rect x="28" y="14" width="10" height="5" rx="2.5"
        stroke="currentColor" stroke-width="2"/>
  <rect x="42" y="61" width="10" height="5" rx="2.5"
        stroke="currentColor" stroke-width="2"/>
  <!-- "io" badge -->
  <rect x="29" y="30" width="22" height="17" rx="4"
        stroke="currentColor" stroke-width="2"/>
  <!-- letter i -->
  <circle cx="35.5" cy="35" r="1.3" fill="currentColor"/>
  <rect x="34.3" y="37.5" width="2.4" height="6.5" rx="1.1" fill="currentColor"/>
  <!-- letter o -->
  <circle cx="45" cy="41" r="4.2" stroke="currentColor" stroke-width="2"/>
  <!-- homecontrol hint line -->
  <line x1="31" y1="52" x2="49" y2="52"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
