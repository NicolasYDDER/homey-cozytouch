<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Panel radiator with vertical fins and bottom control panel -->
  <rect fill="none" x="10" y="12" width="60" height="52" rx="4" stroke="currentColor" stroke-width="2.6"/>
  <!-- Top / bottom rails -->
  <rect fill="none" x="10" y="12" width="60" height="7" rx="4" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="10" y="57" width="60" height="7" rx="4" stroke="currentColor" stroke-width="2"/>
  <!-- Fins -->
  <line fill="none" x1="20" y1="22" x2="20" y2="54" stroke="currentColor" stroke-width="2"/>
  <line fill="none" x1="28" y1="22" x2="28" y2="54" stroke="currentColor" stroke-width="2"/>
  <line fill="none" x1="36" y1="22" x2="36" y2="54" stroke="currentColor" stroke-width="2"/>
  <line fill="none" x1="44" y1="22" x2="44" y2="54" stroke="currentColor" stroke-width="2"/>
  <line fill="none" x1="52" y1="22" x2="52" y2="54" stroke="currentColor" stroke-width="2"/>
  <line fill="none" x1="60" y1="22" x2="60" y2="54" stroke="currentColor" stroke-width="2"/>
  <!-- Control panel on bottom rail -->
  <rect fill="none" x="42" y="58.5" width="24" height="4" rx="2" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="62" cy="60.5" r="1.4" fill="currentColor"/>
  <!-- Feet -->
  <rect fill="none" x="22" y="64" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="50" y="64" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
</svg>
