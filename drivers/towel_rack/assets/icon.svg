  <rect fill="none" x="52" y="8" width="6" height="60" rx="3" stroke="currentColor" stroke-width="2.4"/>
  <!-- Rungs -->
  <rect fill="none" x="24" y="14" width="32" height="5" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="24" y="24" width="32" height="5" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="24" y="34" width="32" height="5" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="24" y="44" width="32" height="5" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <rect fill="none" x="24" y="54" width="32" height="5" rx="2.5" stroke="currentColor" stroke-width="2"/>
